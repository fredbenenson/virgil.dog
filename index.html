<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="stylesheets/style.css">
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src='javascripts/jquery.transit.js'></script>
    <script src='javascripts/virgil.js'></script>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1 id="virgil-name">Virgil Benenson</h1>
        <h2>ca. 2012 - June 2025</h2>

      </div>
    </div>

    <!-- Photo Carousel Modal -->
    <div id="photo-carousel-modal" class="carousel-modal">
      <div class="carousel-container">
        <button class="carousel-close">&times;</button>
        <div class="swiper photo-carousel">
          <div class="swiper-wrapper" id="carousel-wrapper">
            <!-- Photos will be loaded dynamically -->
          </div>
          <div class="swiper-pagination"></div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
        </div>
      </div>
    </div>

  </body>

</html>
